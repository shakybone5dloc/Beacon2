spring:
  application:
    name: beacon-api
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/beacon
    username: postgres
    password: ${POSTGRES_PASSWORD:}
  servlet:
    multipart:
      # Documents are capped at 10 MB; the request allows a little for form fields.
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
beacon:
  # Encrypts the API keys users save. 32 random bytes, base64-encoded; Beacon won't start without it.
  # Changing it makes saved keys unreadable, and users have to add them again.
  secret-key: ${BEACON_SECRET_KEY:}
  postings:
    user-agent: "Beacon personal job tracker"
    # Sources listed here stay off for everyone, whatever keys users add. Comma-separated ids.
    disabled-sources: ${BEACON_DISABLED_SOURCES:adzuna}
    # Keys for keyed sources are per user, added under Settings in the app.
    adzuna:
      country: ${ADZUNA_COUNTRY:us}
  capture:
    # Chrome or Edge used to print postings to PDF; found automatically when blank.
    browser: ${CAPTURE_BROWSER:}
  ai:
    # Each user drafts with their own OpenAI or Anthropic key (OpenAI when they have both).
    openai-model: ${OPENAI_MODEL:gpt-6-sol}
    anthropic-model: ${ANTHROPIC_MODEL:claude-opus-5-5}
