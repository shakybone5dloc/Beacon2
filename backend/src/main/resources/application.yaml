spring:
  application:
    name: beacon-api
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/beacon
    username: postgres
    password: ${POSTGRES_PASSWORD:}
  servlet:
    multipart:
      # Documents are capped at 10 MB; the request allows a little for form fields.
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  # Behind nginx in Docker: trust its X-Forwarded-* headers (from private addresses only), so
  # cookies are marked Secure when users come in over HTTPS.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d
      cookie:
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
beacon:
  # Encrypts the API keys users save. 32 random bytes, base64-encoded; Beacon won't start without it.
  # Changing it makes saved keys unreadable, and users have to add them again.
  secret-key: ${BEACON_SECRET_KEY:}
  # Where users open Beacon; links in emails point here.
  app-url: ${BEACON_APP_URL:http://localhost:4200}
  # The SMTP server the weekly digest is sent through. Any provider's SMTP works: a Gmail
  # app password (smtp.gmail.com, 587, your address and the 16-character app password),
  # Resend (smtp.resend.com, 587, "resend" and an API key) or Mailgun. With no host or
  # from address, nothing is sent and the digest settings page says so.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # The sender, e.g. "Beacon <you@gmail.com>"; Gmail only sends from your own address.
    from: ${MAIL_FROM:}
  postings:
    user-agent: "Beacon personal job tracker"
    # Sources listed here stay off for everyone, whatever keys users add. Comma-separated ids.
    disabled-sources: ${BEACON_DISABLED_SOURCES:adzuna}
    # Keys for keyed sources are per user, added under Settings in the app.
    adzuna:
      country: ${ADZUNA_COUNTRY:us}
  capture:
    # Chrome or Edge used to print postings to PDF; found automatically when blank.
    browser: ${CAPTURE_BROWSER:}
  ai:
    # Each user drafts with their own OpenAI or Anthropic key (OpenAI when they have both).
    openai-model: ${OPENAI_MODEL:gpt-6-sol}
    anthropic-model: ${ANTHROPIC_MODEL:claude-opus-5-5}
    # US dollars per thousand web searches; both providers charge the same, on top of the tokens the results add.
    web-searches-per-thousand: 10.00
    # US dollars per million tokens, for the AI usage page. When a provider changes a price,
    # add a row with the day it starts instead of editing the old one, so past months keep
    # their cost. A model with no row is still counted, just not priced.
    prices:
      - { model: gpt-6-sol,         since: 2026-01-01, input: 2.00, cached-input: 0.20, output: 10.00 }
      - { model: claude-opus-5-5,   since: 2026-01-01, input: 4.00, cached-input: 0.20, output: 20.00 }
      - { model: claude-sonnet-5-5, since: 2026-01-01, input: 2.00, cached-input: 0.20, output: 10.00 }
      - { model: claude-haiku-5-5,  since: 2026-01-01, input: 0.10, cached-input: 0.01, output: 0.50 }

springdoc:
  # Sorted output, so the spec committed for the frontend only changes when the API does.
  writer-with-order-by-keys: true
  # Responses are JSON unless an endpoint says otherwise (file downloads do).
  default-produces-media-type: application/json
  swagger-ui:
    csrf:
      enabled: true
