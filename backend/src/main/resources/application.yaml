spring:
  application:
    name: beacon-api
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/beacon
    username: postgres
    password: ${POSTGRES_PASSWORD:}
  servlet:
    multipart:
      # Documents are capped at 10 MB; the request allows a little for form fields.
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
beacon:
  # Encrypts the API keys users save. 32 random bytes, base64-encoded; Beacon won't start without it.
  # Changing it makes saved keys unreadable, and users have to add them again.
  secret-key: ${BEACON_SECRET_KEY:}
  postings:
    user-agent: "Beacon personal job tracker"
    # Sources listed here stay off, whatever keys are set. Comma-separated ids.
    disabled-sources: ${BEACON_DISABLED_SOURCES:adzuna}
    # Sources that need keys stay switched off until these are set in ../.env
    adzuna:
      app-id: ${ADZUNA_APP_ID:}
      app-key: ${ADZUNA_APP_KEY:}
      country: ${ADZUNA_COUNTRY:us}
    usajobs:
      api-key: ${USAJOBS_API_KEY:}
      email: ${USAJOBS_EMAIL:}
    himalayas:
      api-key: ${HIMALAYAS_API_KEY:}
  capture:
    # Chrome or Edge used to print postings to PDF; found automatically when blank.
    browser: ${CAPTURE_BROWSER:}
  ai:
    # Cover letter drafting stays off until a key is set in ../.env.
    # "auto" uses OpenAI when its key is set, otherwise Claude; or force "openai" / "anthropic".
    provider: ${BEACON_AI_PROVIDER:auto}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-6-sol}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${ANTHROPIC_MODEL:claude-opus-5-5}
