spring:
  application:
    name: beacon-api
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/beacon
    username: postgres
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
beacon:
  postings:
    user-agent: "Beacon personal job tracker"
    # Sources that need keys stay switched off until these are set in ../.env
    adzuna:
      app-id: ${ADZUNA_APP_ID:}
      app-key: ${ADZUNA_APP_KEY:}
      country: ${ADZUNA_COUNTRY:us}
    usajobs:
      api-key: ${USAJOBS_API_KEY:}
      email: ${USAJOBS_EMAIL:}
    himalayas:
      api-key: ${HIMALAYAS_API_KEY:}
