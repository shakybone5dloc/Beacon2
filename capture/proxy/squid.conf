# The page printer's only way out. Every request Chromium makes, including redirects, images
# and the page's own scripts, arrives here, and Squid checks the address it's about to connect
# to after looking the name up. Anything that isn't the public internet is refused: the other
# containers, the home network and tailnet, and a cloud server's metadata service.

http_port 3128

# Not the public internet.
acl not_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl not_public dst 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl not_public dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8 ::ffff:0:0/96

# Ordinary web ports only.
acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT

# Chromium's own services (component updates, time checks, sign-in, safe browsing, metrics),
# which it calls despite the flags that ask it not to. Pages never need these.
acl chromium_services dstdomain .update.googleapis.com clients2.google.com clients1.google.com
acl chromium_services dstdomain .gvt1.com accounts.google.com safebrowsing.googleapis.com
acl chromium_services dstdomain optimizationguide-pa.googleapis.com content-autofill.googleapis.com

http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny not_public
http_access deny chromium_services
# Only the printer can reach this proxy: it listens on the printer's internal network.
http_access allow all

# Pass pages through; keep nothing.
cache deny all
cache_mem 0 MB
via off
forwarded_for delete

access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
coredump_dir /tmp
