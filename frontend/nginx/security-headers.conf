# Browser protections for Beacon's pages, included in each location that serves the app
# (nginx drops server-level add_header lines in any location that sets its own). The API
# sends its own headers from Spring.
#
# Content security policy: scripts, styles, fonts, images and requests only from Beacon itself.
# Inline styles are allowed because Angular adds component styles as <style> elements; inline
# scripts are not, so an injected <script> can't run. Frames: Beacon's own files only (the saved
# posting PDF), and only Beacon may frame Beacon.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# HTTPS only for a year once a browser has seen Beacon over HTTPS (ignored over plain HTTP).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# Job sites and email links don't learn which Beacon page they were opened from.
add_header Referrer-Policy "same-origin" always;
# The microphone is for Say mode in study sessions; nothing else is used.
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
